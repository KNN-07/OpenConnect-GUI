name: Native installer diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_TARGET: ${{ matrix.target }}
      OCVPN_DISPOSABLE_RUNNER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch existing macOS build artifacts
        run: gh run download 35340227306 --name "packages-$PACKAGE_TARGET" --dir artifacts
      - name: Exercise native package with detailed installer logs
        run: python3 packaging/smoke.py --select-gui artifacts 'openconnect-gui*.pkg'
      - name: Preserve PackageKit script logs
        if: failure()
        run: |
          sudo cp /var/log/install.log "$RUNNER_TEMP/ocvpn-install.log"
          sudo chmod 0644 "$RUNNER_TEMP/ocvpn-install.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: installer-log-${{ matrix.target }}
          path: ${{ runner.temp }}/ocvpn-install.log
      - name: Check installed private engine independently of service registration
        if: failure()
        run: '"/Applications/OpenConnect GUI.app/Contents/MacOS/ocvpn" protocols --json'
