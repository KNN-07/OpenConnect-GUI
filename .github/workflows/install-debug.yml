name: Native installer diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_TARGET: ${{ matrix.target }}
      OCVPN_DISPOSABLE_RUNNER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch existing macOS build artifacts
        run: gh run download 35340227306 --name "packages-$PACKAGE_TARGET" --dir artifacts
      - name: Exercise native package with detailed installer logs
        run: python3 packaging/smoke.py --select-gui artifacts 'openconnect-gui*.pkg'
      - name: Read current ServiceManagement diagnostics
        if: failure()
        run: sudo /usr/bin/log show --last 3m --style compact --predicate '(process == "backgroundtaskmanagementd" OR subsystem CONTAINS[c] "ServiceManagement")'
      - name: Verify installed application code signatures
        if: failure()
        run: codesign --verify --deep --strict --verbose=4 '/Applications/OpenConnect GUI.app'
      - name: Check installed private engine independently of service registration
        if: failure()
        run: '"/Applications/OpenConnect GUI.app/Contents/MacOS/ocvpn" protocols --json'
