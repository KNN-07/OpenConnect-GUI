name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Rust, frontend and native protocol fixtures
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check GitHub workflows
        timeout-minutes: 5
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/ci.yml .github/workflows/release.yml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        # The fixtures use hashlib.file_digest, absent from Ubuntu 22.04's Python 3.10.
        with:
          python-version: '3.12'
      - name: Install native development dependencies
        timeout-minutes: 15
        # Matches Dockerfile.release's native/desktop toolchain, not its package builders.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg build-essential clang libclang-dev \
            autoconf automake libtool gettext autopoint pkg-config patch patchelf binutils \
            libgnutls28-dev nettle-dev libgmp-dev libxml2-dev zlib1g-dev libp11-kit-dev \
            libstoken-dev libpskc-dev libpcsclite-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            openssl xz-utils file
      - name: Install pinned tools
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
          npm install --global npm@11.19.0
          python3 --version
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Python source syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for name in subprocess.check_output(['git', 'ls-files', '-z', '*.py']).split(b'\0'):
              if name:
                  path = Path(name.decode())
                  compile(path.read_bytes(), str(path), 'exec')
          PY
      - name: Export canonical frontend model
        run: cargo run --locked -p ocvpn-model --example export_types
      - name: Build frontend production assets
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Test workspace including desktop Rust
        run: cargo test --locked --workspace
      - name: Check workspace and all Rust targets
        run: cargo clippy --locked --workspace --all-targets
      - name: Build authenticated native engine
        run: cargo run --locked -p xtask -- native build --target host
      - name: Verify loopback native protocol fixtures
        timeout-minutes: 15
        # Authentication, policy, HOTP and certificate-chain fixtures only.
        # No privileged tunnel lab, installed service or interactive browser acceptance.
        run: cargo run --locked -p xtask -- verify protocols

  native-check:
    name: Native Rust compilation (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: ./.github/actions/setup-macos
        if: runner.os == 'macOS'
      - uses: ./.github/actions/setup-windows
        if: runner.os == 'Windows'
      - name: Authenticate pinned native source bytes
        run: |
          python3 - <<'PY'
          import json
          import runpy
          native = runpy.run_path("native/build.py")
          spec = json.loads((native["NATIVE"] / "sources.json").read_text())
          native["authenticate"](spec["openconnect"])
          PY
      - name: Prepare frontend assets
        run: |
          npm install --global npm@11.19.0
          cargo run --locked -p ocvpn-model --example export_types
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop run build
      - name: Check native workspace and test targets
        run: cargo check --locked --workspace --all-targets

  checks:
    name: checks
    if: ${{ always() }}
    needs: [build, native-check]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every CI prerequisite to succeed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          NATIVE_RESULT: ${{ needs.native-check.result }}
        run: |
          if [ "$BUILD_RESULT" != success ] || [ "$NATIVE_RESULT" != success ]; then
            echo "CI prerequisites did not succeed: Linux=$BUILD_RESULT native=$NATIVE_RESULT" >&2
            exit 1
          fi
