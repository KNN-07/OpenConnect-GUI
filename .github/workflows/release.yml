name: Native release artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build inside pinned Ubuntu 22.04 baseline
        run: |
          docker build -f packaging/Dockerfile.release -t ocvpn-release-baseline .
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace ocvpn-release-baseline sh packaging/ci-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-x86_64-unknown-linux-gnu
          path: target/packages/x86_64-unknown-linux-gnu/*
          if-no-files-found: error
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            labels: '["self-hosted","macOS","X64","ocvpn-release"]'
          - target: aarch64-apple-darwin
            labels: '["self-hosted","macOS","ARM64","ocvpn-release"]'
          - target: x86_64-pc-windows-msvc
            labels: '["self-hosted","Windows","X64","ocvpn-release"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    environment: native-release
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      OCVPN_APP_SIGN_IDENTITY: ${{ secrets.OCVPN_APP_SIGN_IDENTITY }}
      OCVPN_INSTALLER_SIGN_IDENTITY: ${{ secrets.OCVPN_INSTALLER_SIGN_IDENTITY }}
      OCVPN_NOTARY_PROFILE: ${{ secrets.OCVPN_NOTARY_PROFILE }}
      OCVPN_WINDOWS_CERT_THUMBPRINT: ${{ secrets.OCVPN_WINDOWS_CERT_THUMBPRINT }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Pinned tools and native source build
        run: |
          npm install --global npm@11.19.0
          rustup show active-toolchain
          cargo xtask package --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-${{ matrix.target }}
          path: target/packages/${{ matrix.target }}/*
          if-no-files-found: error
  linux-reference-install:
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - labels: '["self-hosted","Linux","X64","ocvpn-disposable-ubuntu22"]'
            extension: deb
          - labels: '["self-hosted","Linux","X64","ocvpn-disposable-fedora42"]'
            extension: rpm
    runs-on: ${{ fromJSON(matrix.labels) }}
    env:
      OCVPN_DISPOSABLE_RUNNER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packages-x86_64-unknown-linux-gnu
          path: artifacts
      - name: Install real package and exercise installed service
        run: python3 packaging/smoke.py artifacts/openconnect-gui*${{ matrix.extension }}
  native-reference-install:
    needs: native-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            labels: '["self-hosted","macOS","X64","ocvpn-disposable-macos13"]'
            package: 'openconnect-gui*.pkg'
          - target: aarch64-apple-darwin
            labels: '["self-hosted","macOS","ARM64","ocvpn-disposable-macos13"]'
            package: 'openconnect-gui*.pkg'
          - target: x86_64-pc-windows-msvc
            labels: '["self-hosted","Windows","X64","ocvpn-disposable-windows10"]'
            package: '*-setup.exe'
    runs-on: ${{ fromJSON(matrix.labels) }}
    env:
      OCVPN_DISPOSABLE_RUNNER: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packages-${{ matrix.target }}
          path: artifacts
      - name: Install with actual native authorization and approval
        run: python3 packaging/smoke.py --select-gui artifacts '${{ matrix.package }}'
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-reference-install, native-reference-install]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: packages-*
          path: release
      - name: Publish all architectures, source archives, checksums and licenses
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "OpenConnect GUI $TAG" --notes 'Native build and idle installation checks passed. See packaged verification documentation for unverified interactive, tunnel and vendor acceptance. No license server or feature activation is required.'
          for directory in release/packages-*; do
            target="${directory##*/packages-}"
            for file in "$directory"/*; do
              name="${file##*/}"
              gh release upload "$TAG" "$file#$target-$name"
            done
          done
