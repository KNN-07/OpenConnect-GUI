name: Native release artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate matching manifest versions and release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: python3 .github/scripts/release.py preflight
  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  linux-build:
    needs: [preflight, checks]
    timeout-minutes: 180
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build inside pinned Ubuntu 22.04 baseline
        run: |
          docker build -f packaging/Dockerfile.release -t ocvpn-release-baseline .
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace ocvpn-release-baseline sh packaging/ci-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-x86_64-unknown-linux-gnu
          path: target/packages/x86_64-unknown-linux-gnu/*
          if-no-files-found: error
  native-build:
    needs: [preflight, checks]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    environment: native-release
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      PACKAGE_TARGET: ${{ matrix.target }}
      OCVPN_APP_SIGN_IDENTITY: ${{ secrets.OCVPN_APP_SIGN_IDENTITY }}
      OCVPN_INSTALLER_SIGN_IDENTITY: ${{ secrets.OCVPN_INSTALLER_SIGN_IDENTITY }}
      OCVPN_NOTARY_PROFILE: ${{ secrets.OCVPN_NOTARY_PROFILE }}
      OCVPN_WINDOWS_CERT_THUMBPRINT: ${{ secrets.OCVPN_WINDOWS_CERT_THUMBPRINT }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - uses: ./.github/actions/setup-macos
        if: runner.os == 'macOS'
      - uses: ./.github/actions/setup-windows
        if: runner.os == 'Windows'
      - name: Pinned tools and native source build
        run: |
          npm install --global npm@11.19.0
          rustup show active-toolchain
          cargo xtask package --target "$PACKAGE_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-${{ matrix.target }}
          path: target/packages/${{ matrix.target }}/*
          if-no-files-found: error
  linux-reference-install:
    needs: linux-build
    timeout-minutes: 45
    environment: native-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            extension: deb
          - runner: ubuntu-24.04
            extension: rpm
    runs-on: ${{ matrix.runner }}
    env:
      OCVPN_DISPOSABLE_RUNNER: '1'
      PACKAGE_EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packages-x86_64-unknown-linux-gnu
          path: artifacts
      - name: Install Debian package and exercise installed service
        if: matrix.extension == 'deb'
        run: |
          sudo apt-get update
          python3 packaging/smoke.py artifacts/openconnect-gui*"$PACKAGE_EXTENSION"
      - name: Install RPM in an isolated Fedora systemd container
        if: matrix.extension == 'rpm'
        run: python3 .github/scripts/fedora-smoke.py
  native-reference-install:
    needs: native-build
    timeout-minutes: 45
    environment: native-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            package: 'openconnect-gui*.pkg'
          - target: aarch64-apple-darwin
            runner: macos-15
            package: 'openconnect-gui*.pkg'
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            package: '*-setup.exe'
    runs-on: ${{ matrix.runner }}
    env:
      OCVPN_DISPOSABLE_RUNNER: '1'
      PACKAGE_PATTERN: ${{ matrix.package }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packages-${{ matrix.target }}
          path: artifacts
      - name: Install with actual native authorization and approval
        run: python3 packaging/smoke.py --select-gui artifacts "$PACKAGE_PATTERN"
  verify-artifacts:
    needs: [checks, linux-reference-install, native-reference-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: packages-*
          path: release
      - name: Verify all packaged checksums and unique asset names
        run: python3 .github/scripts/release.py verify release
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, verify-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: native-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: packages-*
          path: release
      - name: Upload verified assets to a draft, verify downloads, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
        run: python3 .github/scripts/release.py publish release
