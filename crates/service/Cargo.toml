[package]
name = "ocvpn-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ocvpnd"
path = "src/main.rs"

[[bin]]
name = "ocvpn-installer"
path = "src/installer.rs"

[dependencies]
ocvpn-model = { path = "../model" }
tokio = { workspace = true, features = ["io-std"] }
clap.workspace = true
ocvpn-engine = { path = "../engine" }
ocvpn-net = { path = "../net" }
serde.workspace = true
uuid.workspace = true
serde_json.workspace = true
base64 = "0.22.1"
zeroize.workspace = true
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Registry"] }
windows-service = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", features = ["NSBundle", "NSString", "NSError", "NSObject"] }
objc2-service-management = { version = "=0.3.2", features = ["SMAppService", "block2"] }
