[package]
name = "ocvpn-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ocvpn-model = { path = "../model" }
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
tokio.workspace = true
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
ocvpn-engine = { path = "../engine" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }
