[[permission]]
identifier = "desktop-client"
description = "Trusted local main window may manage user metadata, native dialogs, and the shared authenticated connection client. No shell, arbitrary filesystem, or remote webview access."
commands.allow = ["profiles", "new_profile", "save_profile", "duplicate_profile", "remove_profile", "import_profiles", "export_profiles", "choose_certificate", "read_settings", "save_settings", "forget_credentials", "doctor", "licenses", "manage_service", "approval_settings", "disconnect", "snapshot", "observe", "begin_connection", "cancel_connection", "auth_reply", "certificate_reply", "browser_reply", "browser_clipboard", "export_diagnostics", "quit_ui"]
